/* Offline-first photography and lightbox */
.spot-photo{display:block;width:100%;height:177px;position:relative;margin:8px 0 13px;border:0;padding:0;border-radius:12px;background-position:center;background-size:cover;overflow:hidden;text-align:left;box-shadow:0 6px 17px #0b24321a;cursor:zoom-in}
.spot-photo:after{content:'';position:absolute;inset:48% 0 0;background:linear-gradient(0deg,#0b1c2999,transparent)}
.spot-photo .spot-zoom{position:absolute;bottom:10px;right:10px;z-index:1;color:#fff;background:#0625368a;border:1px solid #ffffff52;border-radius:8px;padding:4px 9px;font-size:11px}
.spot-photo .spot-caption{position:absolute;bottom:12px;left:12px;color:#fff;z-index:1;font-size:12px;font-weight:700}
.day3-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:14px 0 17px}
.gallery-tile{background:#f4f9f8;border:1px solid #d9e7e8;border-radius:12px;overflow:hidden;min-width:0;padding:0;text-align:left;cursor:pointer}
.gallery-tile:hover{border-color:#86bfb4;transform:translateY(-2px);box-shadow:0 6px 16px #1a564621}
.gallery-tile img{display:block;width:100%;height:105px;object-fit:cover}
.gallery-tile div{padding:8px 9px}
.gallery-tile strong{font-size:11px;display:block;color:#284d56;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gallery-tile small{color:#6b8b93;font-size:10px}
.photo-disclaimer{font-size:10px;color:#738993;margin:-1px 0 10px}
.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:20px}
.photo-card{border:1px solid #dae8e7;padding:0;text-align:left;border-radius:13px;overflow:hidden;background:#fff;cursor:zoom-in}
.photo-card:hover{box-shadow:0 7px 22px #17374525;transform:translateY(-2px)}
.photo-card img{display:block;width:100%;height:150px;object-fit:cover}
.photo-card .photo-card-label{display:block;padding:11px 13px;font-size:12px;font-weight:700;color:#31505c}
.lightbox{position:fixed;z-index:1000;inset:0;background:rgba(7,16,27,.91);display:none;align-items:center;justify-content:center;padding:18px}
.lightbox.show{display:flex}
.lightbox-inner{width:min(94vw,1100px);max-height:92vh;display:flex;flex-direction:column;gap:10px;align-items:center}
.lightbox img{display:block;max-width:100%;max-height:79vh;object-fit:contain;border-radius:12px;box-shadow:0 18px 90px #0007}
.lightbox-bottom{color:#e0edf0;display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px;font-size:13px}
.lightbox-close{position:absolute;right:22px;top:17px;border:1px solid #ffffff70;border-radius:30px;background:#153344;color:white;font-size:21px;line-height:1;width:43px;height:43px;cursor:pointer}
@media(max-width:850px){.day3-gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.spot-photo{height:150px}}
@media(max-width:540px){.photo-grid{grid-template-columns:1fr 1fr;gap:9px}.photo-card img{height:105px}.day3-gallery img{height:94px}.lightbox-bottom{font-size:11px}}

/* Additive flight itinerary and Oslo panels */
.day-date{display:block;color:#91aaa9;font-size:10px;font-weight:600;line-height:1.3;margin-top:4px}
.flight-section{margin:16px 0 23px}.flight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(285px,1fr));gap:13px}
.flight-card{border:1px solid #cfdfdc;background:linear-gradient(128deg,#edf7f5,#f8fbfa 65%);border-radius:16px;padding:18px 20px;box-shadow:0 8px 24px rgba(9,57,60,.045)}
.flight-card-top{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#477471;font-weight:700;letter-spacing:.025em}.flight-card-top b{font-size:15px;color:#163f46;margin-left:7px}
.flight-stations{display:grid;grid-template-columns:1fr 36px 1fr;align-items:center;gap:10px;margin:14px 0 8px}

.flight-note{font-size:12px;line-height:1.6;color:#50717b;border-top:1px dashed #bcd5d1;padding-top:10px;margin:13px 0 0}
.flight-journey{border:1px solid var(--border);border-radius:17px;overflow:hidden;margin-top:21px}
.flight-journey-row{width:100%;display:grid;grid-template-columns:86px minmax(0,1fr) 175px 15px;gap:18px;align-items:center;padding:17px 19px;text-align:left;color:inherit;background:#fff;border:0;border-bottom:1px solid var(--border)}.flight-journey-row:last-child{border-bottom:0}.flight-journey-row:hover{background:#f1faf7}
.journey-date b,.journey-date small,.journey-code b,.journey-code span,.journey-route strong,.journey-route small{display:block}.journey-date b{color:#227873;font-size:12px}.journey-date small{font-size:12px;color:#8397a1}.journey-route strong{font-size:14px}.journey-route strong span{color:#249f95}.journey-route small{font-size:11px;color:#67818a;margin-top:4px;line-height:1.55}.journey-code b{font-size:15px}.journey-code span{font-size:12px;color:#50717b;white-space:nowrap}.journey-open{color:#168b85}
.airport-story{padding:36px 24px;margin:25px 0;border:1px solid #dce8e9;border-radius:18px;text-align:center;background:radial-gradient(ellipse at top,#e2f4f0,#fff 70%)}.airport-symbol{font-size:42px;color:#198d86}.airport-story h3{font-size:19px;margin:9px 0}.airport-story p{max-width:610px;margin:0 auto;color:#66818b;font-size:14px}
.oslo-route-hint{background:#f0f8f7;padding:15px 18px;border-left:4px solid #59c7ac;border-radius:12px;margin-bottom:17px}.oslo-route-hint b{font-size:14px}.oslo-route-hint p{color:#476b73;margin:5px 0 0;font-size:13px}
@media (max-width:760px){.flight-journey-row{grid-template-columns:64px minmax(0,1fr);gap:8px}.journey-code{grid-column:2}.journey-open{display:none}.flight-stations strong{font-size:25px}.flight-grid{grid-template-columns:1fr}.journey-route strong{font-size:13px}}

/* User-replaceable photos for food and souvenirs (original emoji position) */
.food{display:flex;gap:14px;align-items:center;padding:11px;min-height:111px}
.food-picture{padding:0;border:0;cursor:zoom-in;display:block;flex:0 0 96px;height:92px;background:#e9f2ef;overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px #dce5e6 inset}
.food-picture img{display:block;width:100%;height:100%;object-fit:cover}
.food-picture:hover img{transform:scale(1.055)}
.food-picture img{transition:transform .2s ease}
.food-content{min-width:0;flex:1}
.food-content b{font-size:13.5px;margin:0 0 5px}
.food-content p{font-size:12px;line-height:1.55}
@media(max-width:690px){.food-picture{flex-basis:88px;height:85px}.food{gap:12px}}

let view='overview', current='d3';let completed={};try{completed=JSON.parse(localStorage.getItem('auroraAtlasChecklist')||'{}')}catch(e){};
const escapeHtml=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=id=>document.getElementById(id);const groupOfDay=n=>groups.find(g=>g.days.includes(n));const group=id=>groups.find(g=>g.id===id);
const headings={overview:['◫','旅程總覽'],day:['◷','逐日故事'],aurora:['✦','極光實驗室'],food:['♧','美食與伴手禮'],photos:['▧','照片相簿'],flights:['✈','航班資訊'],checklist:['✓','旅行清單']};
function renderNav(){byId('tabs').innerHTML=Object.entries(headings).map(([id,[ico,name]])=>`<button class="tab ${id===view?'active':''}" type="button" data-view="${id}" aria-pressed="${id===view}">${ico} ${name}</button>`).join('');const days=Array.from({length:12},(_,i)=>i+1);byId('dayNav').innerHTML=days.map(n=>{let g=groupOfDay(n);return `<button type="button" class="day-btn ${view==='day'&&current===g.id?'active':''}" data-day="${n}"><span class="day-num">D${String(n).padStart(2,'0')}<small class="day-date">${dayDate(n)}</small></span><span style="flex:1"><span class="day-name">${escapeHtml(g.short)}</span><span class="day-sub" style="display:block">${escapeHtml(g.place)}</span></span><span class="status-dot ${g.pending?'':'ready'}">●</span></button>`}).join('');byId('mobileDayNav').innerHTML=days.map(n=>`<button type="button" data-day="${n}" class="${view==='day'&&groupOfDay(n).id===current?'active':''}">Day ${n}</button>`).join('');byId('route').innerHTML=groups.filter(g=>!g.pending).map(g=>`<button type="button" class="route-link ${current===g.id&&view==='day'?'selected':''}" data-group="${g.id}"><span class="route-rail"></span><span><small class="muted">D${g.days.join('–')}</small>　<b>${escapeHtml(g.short)}</b></span></button>`).join('');let n=Object.values(completed).filter(Boolean).length;byId('sideProgress').textContent=`${n} / ${checklist.length} 個探索項目已完成`;byId('sideBar').style.width=(n/checklist.length*100)+'%'}
function renderOverview(){const cards=groups.map(g=>`<button type="button" class="overview-item" data-group="${g.id}"><div class="overview-cover" style="background-image:${g.img?`linear-gradient(0deg,#0a253633,transparent),url('${g.img}')`:'linear-gradient(135deg,#e0e9eb,#f7fbfa)'}"></div><div class="overview-body"><small>DAY ${g.days.join('–')} · ${g.days.map(dayDate).join('–')} · ${escapeHtml(g.country)}</small><strong>${escapeHtml(g.short)}</strong><p>${escapeHtml(g.subtitle)}</p></div></button>`).join('');return `<div class="chapter-head"><div><div class="overline">THE JOURNEY / 北歐三國</div><h2>十二日的旅行故事地圖</h2><p class="lead">點選卡片展開景點。瑞典的城市歷史、芬蘭的馴鹿與冰雪、挪威的史前文化，串起這趟北方旅程。</p></div></div><div class="overview-grid">${cards}</div>`}
function renderDay(){let g=group(current);const upper=`<div class="chapter-head"><div><div class="overline">DAY ${g.days.join('–')} · ${g.days.map(dayDate).join('–')} · ${escapeHtml(g.country)}</div><h2>${escapeHtml(g.title)}</h2><p class="lead">${escapeHtml(g.subtitle)}</p></div><span class="chapter-badge">${escapeHtml(g.place)}</span></div>`;
const flights=flightCards(g.days);if(g.type==='flight')return upper+flights+`<div class="airport-story"><div class="airport-symbol">✈</div><h3>${g.days[0]===1?'第一天是純粹的飛行與轉機日':g.days[0]===11?'跨越時區的返家航程':'最後一段飛行，帶著回憶抵達台灣'}</h3><p>${g.days[0]===1?'這天不安排額外的觀光故事。把護照、機票與轉機動線準備好，留一些力氣迎接隔日的斯德哥爾摩。':g.days[0]===11?'這天以離開奧斯陸、辦理報到與國際航班為主。隔天早上抵達曼谷後，仍有最後一段銜接航班。':'曼谷轉機後回到桃園機場。飛行時間表採抵達地的當地日期；旅行也正式畫下句點。'}</p></div><div class="cta-row"><button class="ghost-btn" data-action="previous">← 上一站</button><button class="main-btn" data-action="next">下一站 →</button></div>`;
if(g.pending)return upper+`<div class="empty-state">尚未確認該日細節。</div>`;
const gallery=g.id==='d3'?`<div class="section-heading"><h3>Day 3 · 四個停靠點</h3><small>依實際行程順序：飛抵露利亞後前往芬蘭</small></div><div class="day3-gallery">${g.spots.map((p,i)=>`<button type="button" class="gallery-tile" data-photo="${SPOT_PHOTOS.d3[i]}"><img src="${PHOTO_ASSETS[SPOT_PHOTOS.d3[i]]}" alt="${escapeHtml(p.name)}的情境示意" loading="lazy"/><div><strong>${escapeHtml(p.name)}</strong><small>點擊看大圖 ↗</small></div></button>`).join('')}</div><div class="photo-disclaimer">圖片為 AI 情境示意，並非實際現場照片。</div>`:'';
return upper+flights+`${g.hotel?`<div class="reveal"><strong>住宿</strong><p>${escapeHtml(g.hotel)}</p></div>`:''}${g.routeHint?`<div class="oslo-route-hint"><b>🗺️ 下午參考路線</b><p>${escapeHtml(g.routeHint)}</p></div>`:''}<div class="feature-photo" role="img" aria-label="${escapeHtml(g.photo)}" style="background-image:linear-gradient(0deg,#092c3b33,#092c3b18),url('${g.img}')"><div class="photo-label">${escapeHtml(g.photo)}</div></div>${gallery}<div class="section-heading"><h3>這一站的故事</h3><small>${g.spots.length} 個探索主題 · 點開細讀</small></div><div class="spots">${g.spots.map((s,i)=>`<section class="spot"><div class="spot-num">STORY ${String(i+1).padStart(2,'0')}</div><h4>${escapeHtml(s.name)}</h4>${(SPOT_PHOTOS[g.id]||[])[i]===null?'':`<button type="button" class="spot-photo" data-photo="${((SPOT_PHOTOS[g.id]||[])[i]||'aurora')}" style="background-image:url('${PHOTO_ASSETS[((SPOT_PHOTOS[g.id]||[])[i]||'aurora')]}')" aria-label="放大${escapeHtml(s.name)}情境示意圖"><span class="spot-caption">${escapeHtml(s.name)}</span><span class="spot-zoom">⊕ 點擊放大</span></button>`}<p>${escapeHtml(s.desc)}</p><details class="reveal"><summary>✦ 打開一個北歐趣聞</summary><p>${escapeHtml(s.story)}</p></details><div class="spot-hint">📍 觀察小提醒：${escapeHtml(s.tip)}</div></section>`).join('')}</div><div class="photo-disclaimer">本頁景點圖片為 AI 情境示意；行程以實際確認的資料為準。</div><div class="section-divider"></div><div class="section-heading"><h3>值得嚐嚐・值得收藏</h3><small>食物與伴手禮圖片可在 images/food/ 更換</small></div><div class="food-grid">${foodCards(g)}</div><div class="cta-row"><button class="ghost-btn" data-action="previous">← 上一站</button><button class="main-btn" data-action="next">下一站 →</button></div>`}
function renderAurora(){return `<div class="overline">THE AURORA LAB</div><h2>極光是如何形成的？</h2><p class="lead">透過簡單的科學知識與互動問答，在追光之前認識天空中的綠色光幕。</p><div class="section-heading"><h3>極光顏色解密</h3><small>高度為概略值</small></div><div class="science-grid"><div class="science"><div class="swatch" style="background:#5fcd8b"></div><h3>綠色極光</h3><p>約100–150公里高度，氧原子受激發後放出綠光；也是最常見的顏色之一。</p></div><div class="science"><div class="swatch" style="background:#ed827f"></div><h3>紅色極光</h3><p>較高空、通常約200公里以上的氧原子能產生深紅色光芒。</p></div><div class="science"><div class="swatch" style="background:#b59df6"></div><h3>紫色／藍色</h3><p>與氮分子及離子的發光有關，常出現在快速變化的極光邊緣。</p></div></div><div class="section-heading"><h3>追光迷思小測驗</h3><small>選一個答案，立即揭曉</small></div><div id="quiz"></div><div class="data-note" style="margin-top:18px">觀測提醒：極光活動、雲量、黑暗程度與光害都會影響可見性；相機長曝光常比肉眼顯示更多顏色。極光船與玻璃屋都不保證看到極光。</div>`}
const quizzes=[{q:'為什麼相機拍到的極光，常比肉眼看見的鮮豔？',options:['相機能累積更多光線','極光只會對相機發光','玻璃鏡頭會製造綠色'],answer:0,why:'肉眼在低光下的色彩辨識能力下降，相機則能透過較長曝光或感光處理呈現更多顏色。'},{q:'看到很強的極光活動預報，就一定能看到極光嗎？',options:['一定可以','不一定，厚雲和光害仍可能遮擋','只要在海上就可以'],answer:1,why:'即使太陽活動很強，若當地被厚雲覆蓋，仍可能看不到極光。'},{q:'最常見的綠色極光，主要與哪種大氣成分有關？',options:['氧','海鹽','二氧化碳'],answer:0,why:'高層大氣中的氧原子受到能量激發，會在特定波長發出綠色光。'}];let quizAnswers={};
function renderQuiz(){byId('quiz').innerHTML=quizzes.map((q,i)=>`<div class="quizcard"><h3>Q${i+1}. ${q.q}</h3><div class="quizchoices">${q.options.map((a,j)=>`<button type="button" class="quizchoice ${quizAnswers[i]===j?(j===q.answer?'ok':'no'):''}" data-quiz="${i}" data-choice="${j}">${String.fromCharCode(65+j)}. ${a}</button>`).join('')}</div>${quizAnswers[i]!==undefined?`<div class="quizfeedback">${quizAnswers[i]===q.answer?'✓ 答對了！':'↳ 答案是 '+String.fromCharCode(65+q.answer)+'。'} ${q.why}</div>`:''}</div>`).join('')}
function renderPhotos(){return `<div class="overline">PHOTO JOURNAL / 圖片巡禮</div><h2>北歐旅程・景點相簿</h2><p class="lead">點擊圖片可以放大。圖片位於 images/ 資料夾，離線也可顯示。目前部分為情境示意；若有自己的實際照片，可直接以相同檔名覆蓋。</p><div class="photo-grid">${PHOTO_GALLERY.map(([k,label])=>`<button class="photo-card" type="button" data-photo="${k}"><img src="${PHOTO_ASSETS[k]}" loading="lazy" alt="${escapeHtml(label)}情境示意"><span class="photo-card-label">${escapeHtml(label)} ↗</span></button>`).join('')}</div>`}
function foodCards(g){return g.food.map((f,i)=>{const k=FOOD_PHOTO_KEYS[g.id]?.[i];return `<div class="food"><button type="button" class="food-picture" data-photo="${k}" aria-label="放大：${escapeHtml(f[1])}"><img loading="lazy" src="${PHOTO_ASSETS[k]}" alt="${escapeHtml(f[1])}圖片預留位置；可在 images/food 換圖" /></button><div class="food-content"><b>${escapeHtml(f[1])}</b><p>${escapeHtml(f[2])}</p></div></div>`}).join('')}
function renderFood(){let foods=groups.filter(g=>g.food && g.food.length>0);return `<div class="overline">TASTE & TREASURE</div><h2>北歐風味與伴手禮收藏簿</h2><p class="lead">美食與紀念品依停靠地整理。圖片預設是可自行替換的佔位圖：解壓縮後，在 images/food/ 用同名 JPG 照片覆蓋即可。點圖片可放大。</p>${foods.map(g=>`<div class="section-heading"><h3>Day ${g.days.join('–')} · ${escapeHtml(g.short)}</h3><button class="ghost-btn" data-group="${g.id}">探索這一站 ↗</button></div><div class="food-grid">${foodCards(g)}</div>`).join('')}`}
function renderChecklist(){let n=Object.values(completed).filter(Boolean).length;return `<div class="overline">MY TRAVEL JOURNAL</div><h2>我的北歐探索清單</h2><p class="lead">把旅途變成一場小型探索任務。勾選的項目會嘗試儲存在此瀏覽器的本機儲存空間，不會上傳到伺服器。</p><div style="display:flex;align-items:center;gap:14px;margin:22px 0 10px"><strong style="font-size:24px">${n} <span style="font-size:13px;color:#91a1a6">/ ${checklist.length}</span></strong><div class="bar" style="flex:1;height:12px"><span style="width:${n/checklist.length*100}%"></span></div></div><div class="panel" style="border-radius:12px;padding:8px 20px;margin-top:17px">${checklist.map(([tag,name],i)=>`<label class="checkitem ${completed[i]?'done':''}"><input type="checkbox" data-check="${i}" ${completed[i]?'checked':''}/><span>${escapeHtml(name)}</span></label>`).join('')}</div><div class="cta-row"><span class="hint">已勾選項目僅儲存於目前裝置（若瀏覽器允許）。</span><button class="ghost-btn" data-action="reset">清空勾選</button></div>`}
function render(){renderNav();byId('content').innerHTML=({overview:renderOverview,day:renderDay,aurora:renderAurora,food:renderFood,photos:renderPhotos,flights:airportJourney,checklist:renderChecklist})[view]();if(view==='aurora')renderQuiz()}
function navigate(to,id){view=to;if(id)current=id;render();document.querySelector('.tabs').scrollIntoView({block:'nearest',behavior:'smooth'})}window.navigate=navigate;
function openPhoto(k){const pic=PHOTO_ASSETS[k]||PHOTO_ASSETS.aurora;byId('lightboxImg').src=pic;byId('lightboxTitle').textContent=PHOTO_TITLES[k]||'北歐旅行畫面';byId('lightbox').classList.add('show');byId('lightbox').focus()}function closePhoto(){byId('lightbox').classList.remove('show')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto()});document.addEventListener('click',e=>{if(e.target.id==='lightbox'||e.target.closest('[data-close-photo]')){closePhoto();return}let p=e.target.closest('[data-photo]');if(p){openPhoto(p.dataset.photo);return}let viewEl=e.target.closest('[data-view]');if(viewEl){navigate(viewEl.dataset.view);return}let d=e.target.closest('[data-day]');if(d){navigate('day',groupOfDay(+d.dataset.day).id);return}let g=e.target.closest('[data-group]');if(g){navigate('day',g.dataset.group);return}let a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='reset'){completed={};try{localStorage.removeItem('auroraAtlasChecklist')}catch(err){};render()}else{let ix=groups.findIndex(g=>g.id===current);current=groups[Math.max(0,Math.min(groups.length-1,ix+(a.dataset.action==='next'?1:-1)))].id;render()}return}let q=e.target.closest('[data-quiz]');if(q){quizAnswers[+q.dataset.quiz]=+q.dataset.choice;renderQuiz()}});document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){completed[e.target.dataset.check]=e.target.checked;try{localStorage.setItem('auroraAtlasChecklist',JSON.stringify(completed))}catch(err){};render()}});render();
</script>
